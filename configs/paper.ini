# ==============================================================================
# Quantum Image Denoising Configuration (MHRQI ECTI Revision)
# ==============================================================================

[general]
# Version of the configuration schema (integer)
schema_version = 1

# Identifier string used for naming output subdirectories under runs/
experiment_name = bscan_benchmark_statevector

[image]
# Dimension of test image N x N
# Choices: 64, 128, 256, 512 (Higher N increases qubit count & simulation runtime)
image_size = 256

# OpenCV interpolation method for image scaling
# Choices: opencv_INTER_AREA (recommended for downsampling), opencv_INTER_CUBIC, opencv_INTER_LINEAR, opencv_INTER_NEAREST
resize_interpolation = opencv_INTER_AREA

# Block subdivision dimension d for FRQI tile decomposition (integer, default: 2)
subdivision_factor = 2

# Pixel intensity bit depth (8 = 256 intensity levels / 8 color qubits)
bit_depth = 8

[execution]
# Quantum simulation strategy
# Choices: statevector (ideal exact simulation), shots or qasm (sampling-based measurement)
benchmark_mode = statevector

# Number of measurement shots for shot-based mode (e.g., 10000000). Set to none for statevector mode
shots = none

# Enable or disable quantum image denoising pipeline (true / false)
denoise = true

# Use the lazy statevector upload path for faster simulation (true / false)
fast = true

# Generate and save detailed intermediate diagnostic plots (true / false)
verbose_plots = false

# The statistical benchmark invokes comparators itself; keep this false to avoid duplicate work in main.py.
run_comparison = false

[seeds]
# Random seeds for reproducible execution across sub-modules
python = 20260818
numpy = 20260818
transpiler = 20260818
simulator = 20260818
bootstrap = 20260818

[simulator]
# Qiskit simulator backend class
# Choices: AerSimulator, QasmSimulatorPy
backend = AerSimulator

# Aer simulation method
# Choices: statevector, matrix_product_state, density_matrix, extended_stabilizer, automatic
method = statevector

# Hardware execution device
# Choices: CPU, GPU
device = CPU

# Allow CPU fallback if requested GPU device is unavailable (true / false)
allow_device_fallback = false

[baseline.bm3d]
# BM3D estimated noise standard deviation (float, e.g., 0.05)
sigma = 0.05

# BM3D filtering stage
# Choices: ALL_STAGES, HARD_THRESHOLDING
stage = ALL_STAGES

[baseline.nlmeans]
# Non-Local Means filter strength parameter h (float/int, e.g., 10)
h = 10

# NLMeans template patch size in pixels (odd integer, e.g., 7)
template_window = 7

# NLMeans search window size in pixels (odd integer, e.g., 21)
search_window = 21

[baseline.srad]
# SRAD diffusion iteration count (integer, e.g., 400)
iterations = 400

# SRAD time step delta t (float, e.g., 0.65)
dt = 0.65

# SRAD exponential decay coefficient (float, e.g., 0.8)
decay = 0.8

[baseline.siamesegan]
# Run the authors' released SiameseGAN checkpoint as a fixed inference baseline.
# This is public-model inference only; no retraining is performed by MHRQI.
enabled = true

# Public release: https://github.com/sml-iisc/SiameseGAN (commit 0adc962d)
repository = C:/Users/Keno/AppData/Local/Temp/siamesegan_public_probe_20260824

# Isolated compatibility runtime for the public TensorFlow/Keras release.
python_executable = C:/Users/Keno/AppData/Local/Temp/siamesegan_tf210_py39/Scripts/python.exe

[statistics]
# Significance level alpha for confidence intervals and hypothesis testing (0.05 = 95% CI)
alpha = 0.05

# Wilcoxon signed-rank test alternative hypothesis
# Choices: two-sided, greater, less
wilcoxon_alternative = two-sided

# Wilcoxon zero-difference handling method
# Choices: wilcox, pratt, zsplit
wilcoxon_zero_method = wilcox

# Wilcoxon p-value computation method
# Choices: exact, approx
wilcoxon_method = exact

# Bootstrap confidence interval algorithm
# Choices: BCa (Bias-Corrected and Accelerated), percentile, basic
bootstrap_method = BCa

# Number of bootstrap resamples (integer, e.g., 10000 for robust statistics)
bootstrap_resamples = 10000

# Multiple hypothesis testing p-value adjustment method
# Choices: Holm, Bonferroni, FDR_BH, None
multiple_testing = Holm
